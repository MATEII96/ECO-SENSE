<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg:#07090a;--bg2:#0c1210;--panel:#101914;
    --b:rgba(74,222,128,.1);--b2:rgba(74,222,128,.22);
    --g:#4ade80;--g2:#22d3ee;--g3:#a3e635;
    --am:#fbbf24;--warn:#f59e0b;--red:#f87171;
    --t:#d1fae5;--t2:#86efac;--mu:#3d6b4f;
    --w:#d0fff4;
    --F:'Fraunces',Georgia,serif;
    --B:'Outfit',sans-serif;
    --M:'DM Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font-family:var(--B);overflow-x:hidden;cursor:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--mu);border-radius:2px}

#cD,#cR{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%)}
#cD{width:7px;height:7px;background:var(--g);mix-blend-mode:screen;transition:transform .08s}
#cR{width:34px;height:34px;border:1.5px solid var(--g2);opacity:.6;transition:all .18s}
body:has(a:hover) #cR,body:has(button:hover) #cR,body:has(input:hover) #cR{width:50px;height:50px;border-color:var(--g);opacity:1}
body::after{content: '';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg='http://www.w3.org/2000/svg' width='200'%3E%3Cfliter id='n'%3E%3CfeTurbulence type'fractalNoise' baseFrequency='.0' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height'200' filter='url(%23n)' opacity='.03' /%eE%3C/svg%3E");opacity:.5}

#prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--g),var(--g2));z-index:300;width:0;transition:width .08s}

#nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:.9rem 3rem;background:rgba(7,9,10,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--b)}
#nav.sc{box-shadow:0 4px 40px rgba(0,0,0,.6)}
.nlogo{font-family:var(--F);font-weight:700;font-size:1.28rem;color:var(--w);letter-spacing:-.03em;display:flex;align-items:center;gap:.4rem;cursor:none;text-decoration:none}
.nd{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.nl{display:flex;gap:1.6rem;list-style:none}
.nl a{font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);text-decoration:none}
.nl a.on,.nl a:hover{color:var(--g)}
.nbg{display:flex;align-items:center;gap:.4rem;border:1px solid var(--b2);border-radius:100px;padding:.28rem .8rem;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g2)}
.nbg span{width:6px;height:6px;border-radius:50%;background:var(--g2);animation:blink 1.5s infinite}
@media(max-width:900px){.nl{display:none}#nav{padding:.8rem 1.4rem}}

section{position:relative;z-index:1}
.C{max-width:1160px;margin:0 auto;padding: 0 3rem}
@media(max-width:700px){.C{padding: 0 1.2rem}}
.sup{font-family:var(--M);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g2);display:flex;align-items:center;gap:.55rem;margin-bottom:.8rem}
.sup::before{content:'';display:block;width:20px;height:1px;background:var(--g2)}
h2.T{font-family:var(--F);font-weight:900;font-size:clamp(2.2rem,4.5vw,3.8rem);line-height:1.05;letter-spacing:-.04em;color:var(--w)}
h2.T .a{color:var(--g);font-style:italic}
h2.T .a2{color:var(--g2)}
.sub{font-size:.98rem;line-height:1.8;color:var(--t);opacity:.72;max-width:600px;margin-top:.8rem}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1)}
.rv.up{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}
.card{background:var(--panel);border:1px solid var(--b);border-radius:18px;transition:border-color .3s,transform .3s,box-shadow .3s}
.card:hover{border-color:var(--b2);transform:translateY(-3px);box-shadow:0 8px 32px rgba(74,222,128,.06)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.7rem;border-radius:100px;font-family:var(--B);font-weight:600;font-size:.88rem;border:none;transition:all .2s;text-decoration:none}
.btn-g{background:var(--g);color:var(--bg)}
.btn-g:hover{transform:translateY(-2px);box-shadow: 0 0 28px rgba(74,222,128,.35)}
.btn-o{background:transparent;color:var(--t2);border:1px solid rgba(134,239,172,.25)}
.btn-o:hover{border-color:var(--g);color:var(--g)}
.formula{font-family:var(--M);font-size:.78rem;padding:.4rem .85rem;border-radius:7px;background:rgba(74,2222,128,.05);border:1px solid rgba(74,222,128,.1);color:var(--g);display:block;margin:.3rem 0}
